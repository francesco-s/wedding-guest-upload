<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕵️ Admin Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .stats-bar {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 14px 20px;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }
        .stat-card .value {
            font-size: 1.8em;
            font-weight: 700;
            background: linear-gradient(135deg, #00897b, #00695c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        .stat-card .label {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
        }
        .section-title {
            padding: 20px 20px 10px;
            font-size: 1.1em;
            color: #aaa;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .count {
            background: #2a2a2a;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            color: #888;
        }
        .user-folder {
            margin: 0 20px 12px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }
        .user-folder-header {
            padding: 14px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            transition: background 0.2s;
            user-select: none;
        }
        .user-folder-header:hover { background: #222; }
        .user-folder-header .folder-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-folder-header .file-count {
            background: #2a2a2a;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            color: #888;
        }
        .user-folder-header .chevron {
            transition: transform 0.2s;
            color: #555;
        }
        .user-folder-header.open .chevron { transform: rotate(180deg); }
        .user-folder-body {
            display: none;
            padding: 12px;
            background: #141414;
            border-top: 1px solid #2a2a2a;
        }
        .user-folder-body.open { display: block; }
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        @media (max-width: 480px) {
            .admin-grid { grid-template-columns: repeat(3, 1fr); }
        }
        .empty-folder {
            padding: 20px;
            text-align: center;
            color: #555;
            font-size: 0.9em;
        }
        .loading-state {
            padding: 40px 20px;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <span>🕵️ Admin Dashboard</span>
        <button class="btn-logout" onclick="Auth.logout()">Esci</button>
    </nav>

    <!-- Stats -->
    <div class="stats-bar">
        <div class="stat-card">
            <div class="value" id="stat-public">-</div>
            <div class="label">Foto Pubbliche</div>
        </div>
        <div class="stat-card">
            <div class="value" id="stat-users">-</div>
            <div class="label">Utenti</div>
        </div>
        <div class="stat-card">
            <div class="value" id="stat-private">-</div>
            <div class="label">Foto Private</div>
        </div>
    </div>

    <!-- Public Gallery -->
    <div class="section-title">
        🌍 Galleria Pubblica
        <span class="count" id="public-count">0</span>
    </div>
    <div class="admin-grid" id="admin-public-grid">
        <div class="loading-state">Caricamento...</div>
    </div>

    <!-- Private Folders -->
    <div class="section-title" style="margin-top: 24px;">
        🔒 Cartelle Private
        <span class="count" id="private-count">0</span>
    </div>
    <div id="private-folders">
        <div class="loading-state">Caricamento...</div>
    </div>

    <!-- Lightbox (shared for all grids) -->
    <div class="lightbox" id="lightbox">
        <div class="lb-close" onclick="AdminGallery.closeLightbox()">✕</div>
        <button class="lb-nav lb-prev" id="lb-prev" onclick="AdminGallery.nav(-1)">&#10094;</button>
        <div id="lb-media"></div>
        <button class="lb-nav lb-next" id="lb-next" onclick="AdminGallery.nav(1)">&#10095;</button>
        <div class="lb-footer">
            <div class="lb-info">
                <div class="counter" id="lb-counter"></div>
                <div class="author-name" id="lb-author"></div>
            </div>
            <button class="lb-btn" onclick="AdminGallery.toggleFullscreen()">⛶ Fullscreen</button>
            <a class="lb-btn" id="lb-download" download>📥 Scarica</a>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
